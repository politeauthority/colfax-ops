# kio shared staging namespace — GitOps-owned bits only (namespace, CI RBAC,
# SealedSecrets). The app is deployed into kio-stg by the kio repo's STG
# workflow per PR (opt-in `stg-env` label); see private-ops kio/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kio-stg
spec:
  project: default
  source:
    repoURL: 'git@github.com:politeauthority/private-ops.git'
    path: kio/stg
    targetRevision: main
  destination:
    namespace: kio-stg
    name: in-cluster
  syncPolicy:
    automated:
      selfHeal: true
      # No prune: CI deploys Deployments/Services/Jobs into this namespace that
      # are not in git; pruning would delete the staging app under test.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
