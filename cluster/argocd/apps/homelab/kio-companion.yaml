# kio-companion (production). Manifests live in private-ops:kio/companion — a
# kustomize overlay that pulls kubernetes-manifests/base from the kio-companion
# repo at the release tag. The kio-companion repo's Release Please workflow bumps
# that overlay on every release; ArgoCD syncs it, running the
# kio-companion-migrate PreSync hook before the rollout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kio-companion
spec:
  project: default
  source:
    repoURL: 'git@github.com:politeauthority/private-ops.git'
    path: kio/companion
    targetRevision: main
  destination:
    namespace: kio-companion-prod
    name: in-cluster
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
