apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: graylog-forwarder
spec:
  project: default
  source:
    repoURL: 'git@github.com:politeauthority/private-ops.git'
    path: graylog/forwarder
    targetRevision: main
  destination:
    namespace: graylog
    name: in-cluster
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
