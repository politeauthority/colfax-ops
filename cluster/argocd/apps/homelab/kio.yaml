# kio dashboard (production). Manifests live in private-ops:kio/kio — a kustomize
# overlay that pulls kubernetes-manifests/base from the public kio repo at the
# release tag. The kio repo's PRD workflow bumps that overlay on every release;
# ArgoCD syncs it, running the kio-migrate PreSync hook before the rollout.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kio
spec:
  project: default
  source:
    repoURL: 'git@github.com:politeauthority/private-ops.git'
    path: kio/kio
    targetRevision: main
  destination:
    namespace: kio
    name: in-cluster
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
