# Dex is unused — SSO goes straight to Authentik via oidc.config
# (argocd-cm-oidc.yaml). Deleting the resources here (rather than
# replicas: 0) lets the app's prune remove them from the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
  namespace: argocd
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-dex-server
  namespace: argocd
$patch: delete
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-dex-server
  namespace: argocd
$patch: delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-dex-server
  namespace: argocd
$patch: delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-dex-server
  namespace: argocd
$patch: delete
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-dex-server-network-policy
  namespace: argocd
$patch: delete
