# Public cert for harbor.alix.lol.
#
# Deliberately NOT a SAN on traefik's shared `public-tls`: that cert is issued
# with an HTTP01 solver, so every re-issue re-validates all of its names. Three
# of them (ha./harbor./matrix.squid-ink.us) currently resolve to a stale WAN IP
# because the *.squid-ink.us wildcard stopped tracking it, so adding a SAN there
# would fail the whole cert. A dedicated cert keeps this route independent of
# that breakage.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: harbor-public-tls
  namespace: harbor
spec:
  secretName: harbor-public-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "harbor.alix.lol"
---
# harbor.alix.lol is the primary name (it matches externalURL, so the registry
# token realm points here). harbor.squid-ink.us is kept so it resumes working
# as soon as the wildcard is repaired.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor-alix
  namespace: harbor
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`harbor.alix.lol`) && (PathPrefix(`/api/`) || PathPrefix(`/service/`) || PathPrefix(`/v2/`) || PathPrefix(`/chartrepo/`) || PathPrefix(`/c/`))"
      kind: Rule
      priority: 100
      services:
        - name: harbor-core
          port: 80
    - match: Host(`harbor.alix.lol`)
      kind: Rule
      services:
        - name: harbor-portal
          port: 80
  tls:
    secretName: harbor-public-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`harbor.squid-ink.us`) && (PathPrefix(`/api/`) || PathPrefix(`/service/`) || PathPrefix(`/v2/`) || PathPrefix(`/chartrepo/`) || PathPrefix(`/c/`))"
      kind: Rule
      priority: 100
      services:
        - name: harbor-core
          port: 80
    - match: Host(`harbor.squid-ink.us`)
      kind: Rule
      services:
        - name: harbor-portal
          port: 80
  tls: {}
