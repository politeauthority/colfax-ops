# Grafana datasource for the cluster_stats Postgres DB (private-ops cluster-stats
# CronJob; read-only role cluster_stats_ro). Sealed because the datasource YAML
# carries the DB password. The grafana datasource sidecar picks it up via the
# grafana_datasource=1 label.
#
# Reseal (password = private-ops q-postgres cluster-stats-ro-postgres-user):
#   kubectl create secret generic grafana-datasource-cluster-stats -n monitoring \
#     --dry-run=client -o yaml --from-file=cluster-stats-datasource.yaml=ds.yaml \
#     | kubeseal --controller-namespace kube-system --controller-name sealed-secrets-controller -o yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-datasource-cluster-stats
  namespace: monitoring
  labels:
    grafana_datasource: '1'
spec:
  encryptedData:
    cluster-stats-datasource.yaml: 
  template:
    metadata:
      name: grafana-datasource-cluster-stats
      namespace: monitoring
      labels:
        grafana_datasource: '1'
    type: Opaque
