version: '3'
tasks:

  check-k:
    cmds:
      - |
        echo "Checking cluster/argocd"
        kustomize build cluster/argocd

        echo "Checking cluster/bedrock/gateway-api-crds"
        kustomize build cluster/bedrock/gateway-api-crds

        echo "Checking cluster/sandbox/mosquitto"
        kustomize build cluster/sandbox/mosquitto

        echo "Checking cluster/sandbox/github-runners"
        kustomize build cluster/sandbox/github-runners

    silent: true

  setup-helm:
    cmds:
      - |
        helm repo add jetstack https://charts.jetstack.io
        helm repo add fluent https://fluent.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo add harbor https://helm.goharbor.io
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        helm repo add nfs-subdir-external-provisioner https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo update
    silent: true

  check-helm:
    deps: [setup-helm]
    cmds:
      - |
        set -e
        # nginx-gateway-fabric-private is decommissioned and its upstream chart is gone
        # from helm.nginx.com; skip it until the directory is removed.
        skip="cluster/bedrock/ingress/nginx-gateway-fabric-private"
        for chart in $(find cluster -name Chart.yaml -not -path '*/charts/*' -exec dirname {} \; | sort); do
          if [ "$chart" = "$skip" ]; then
            echo "Skipping $chart"
            continue
          fi
          echo "Checking $chart"
          helm dependency build "$chart"
          helm lint "$chart" -f "$chart/values-colfax.yaml"
        done

    silent: true
